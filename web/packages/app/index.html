<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadencia</title>
    <style>
      :root {
        --bg: #f4f5f2; --surface: #ffffff; --ink: #161a1d; --muted: #59636b; --line: #d8ddd9;
        --accent: #1c6f80; --good: #2f7d46; --warn: #a1620a; --bad: #b3361f;
        color-scheme: light;
        font-family: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #121517; --surface: #1a1e21; --ink: #e8ebe7; --muted: #a2aba6; --line: #30373a;
          --accent: #5fb7c8; --good: #6fc48a; --warn: #e0ad4f; --bad: #f08a72; color-scheme: dark; }
      }
      body { margin: 0; background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.5; }
      .app { max-width: 920px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 64px; display: grid; gap: 20px; }
      header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between; }
      header.top h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.01em; }
      nav.sections { display: flex; flex-wrap: wrap; gap: 6px; }
      nav.sections a { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 14px; text-decoration: none; }
      nav.sections a[aria-current="page"] { color: var(--ink); border-color: var(--ink); }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: grid; gap: 10px; }
      .card h2 { margin: 0; font-size: 1.15rem; }
      .muted { color: var(--muted); }
      .pill { display: inline-block; font-size: 0.8rem; padding: 1px 10px; border-radius: 999px; border: 1px solid currentColor; }
      .pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.info { color: var(--accent); }
      table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
      th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
      .scroll { overflow-x: auto; }
      button.primary, button.secondary { font: inherit; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
      button.primary { background: var(--accent); color: var(--surface); border: 1px solid var(--accent); }
      button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      button:disabled { opacity: 0.5; cursor: default; }
      div.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      form.row, form.row fieldset { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
      form.row fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
      label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
      input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
      input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--bad); }
      label .error { font-size: 0.8rem; }
      .message { display: grid; gap: 6px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); }
      .message.coach { background: var(--surface); }
      .message.athlete { background: transparent; justify-self: end; max-width: 80%; }
      .error { color: var(--bad); }
      .report h3, .report p { margin: 0; }
      .report { display: grid; gap: 6px; }
      .report details summary { cursor: pointer; color: var(--accent); }
      .report h4 { margin: 12px 0 4px; font-size: 0.95rem; }
      .report ul { margin: 0; padding-left: 20px; }
      .report details > p { margin-top: 12px; }
      a.connect { display: inline-block; background: var(--accent); color: var(--surface); padding: 10px 18px; border-radius: 6px; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
