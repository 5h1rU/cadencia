<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadencia</title>
    <style>
      :root {
        --bg: #f4f5f2; --surface: #ffffff; --ink: #161a1d; --muted: #59636b; --line: #d8ddd9;
        --accent: #1c6f80; --good: #2f7d46; --warn: #a1620a; --bad: #b3361f;
        color-scheme: light;
        font-family: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #121517; --surface: #1a1e21; --ink: #e8ebe7; --muted: #a2aba6; --line: #30373a;
          --accent: #5fb7c8; --good: #6fc48a; --warn: #e0ad4f; --bad: #f08a72; color-scheme: dark; }
      }
      body { margin: 0; background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.5; }
      .app { max-width: 920px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 64px; display: grid; gap: 20px; }
      header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between; }
      header.top h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.01em; }
      nav.sections { display: flex; flex-wrap: wrap; gap: 6px; }
      nav.sections a { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 14px; text-decoration: none; }
      nav.sections a[aria-current="page"] { color: var(--ink); border-color: var(--ink); }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: grid; gap: 10px; }
      .card h2 { margin: 0; font-size: 1.15rem; }
      .muted { color: var(--muted); }
      .pill { display: inline-block; font-size: 0.8rem; padding: 1px 10px; border-radius: 999px; border: 1px solid currentColor; }
      .pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.info { color: var(--accent); }
      table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
      th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
      .scroll { overflow-x: auto; }
      button.primary, button.secondary { font: inherit; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
      button.primary { background: var(--accent); color: var(--surface); border: 1px solid var(--accent); }
      button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      button:disabled { opacity: 0.5; cursor: default; }
      div.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      form.row, form.row fieldset { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
      form.row fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
      label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
      input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
      input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--bad); }
      label .error { font-size: 0.8rem; }
      .message { display: grid; gap: 6px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); }
      .message.coach { background: var(--surface); }
      .message.athlete { background: transparent; justify-self: end; max-width: 80%; }
      .error { color: var(--bad); }
      .report h3, .report p { margin: 0; }
      .report { display: grid; gap: 6px; }
      .report details summary { cursor: pointer; color: var(--accent); }
      .report h4 { margin: 12px 0 4px; font-size: 0.95rem; }
      .report ul { margin: 0; padding-left: 20px; }
      .report details > p { margin-top: 12px; }
      main.page { position: relative; display: grid; gap: 20px; view-transition-name: page; }
      /* Data on screen stays while it is read again; it dims, and says so, only if the read takes a while. */
      .card { transition: opacity 150ms ease-out; }
      main.refreshing > .card { opacity: 0.6; transition-delay: 400ms; }
      p.pending { position: absolute; z-index: 1; top: 21px; right: 20px; margin: 0; font-size: 0.8rem; color: var(--muted); animation: fade-in 150ms ease-out 400ms both; }
      .placeholder { height: 22px; border-radius: 4px; background: linear-gradient(90deg, var(--line) 25%, var(--bg) 50%, var(--line) 75%) 0 0 / 200% 100%; animation: shimmer 1.4s linear infinite; }
      .history-form .placeholder { width: 60%; }
      @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
      ::view-transition-old(page), ::view-transition-new(page) { animation-duration: 200ms; animation-timing-function: ease-out; }
      html:active-view-transition-type(forward)::view-transition-old(page) { animation-name: page-out-to-start; }
      html:active-view-transition-type(forward)::view-transition-new(page) { animation-name: page-in-from-end; }
      html:active-view-transition-type(backward)::view-transition-old(page) { animation-name: page-out-to-end; }
      html:active-view-transition-type(backward)::view-transition-new(page) { animation-name: page-in-from-start; }
      @keyframes page-out-to-start { to { opacity: 0; transform: translateX(-24px); } }
      @keyframes page-in-from-end { from { opacity: 0; transform: translateX(24px); } }
      @keyframes page-out-to-end { to { opacity: 0; transform: translateX(24px); } }
      @keyframes page-in-from-start { from { opacity: 0; transform: translateX(-24px); } }
      /* The history's first answer grows the placeholders into its cards. */
      html:active-view-transition-type(reveal) .history-form { view-transition-name: history-form; view-transition-class: reveal; }
      html:active-view-transition-type(reveal) .history-activities { view-transition-name: history-activities; view-transition-class: reveal; }
      ::view-transition-group(*.reveal) { overflow: clip; border-radius: 8px; animation-duration: 350ms; animation-timing-function: cubic-bezier(0.2, 0, 0, 1); }
      ::view-transition-old(*.reveal) { animation: fade-out 120ms ease-out both; }
      ::view-transition-new(*.reveal) { animation: fade-in 300ms ease-out 60ms both; }
      html:active-view-transition-type(reveal)::view-transition-new(page) { animation-name: rise-in; }
      /* A refresh fades new activities in and slides the others to their place. */
      html:active-view-transition-type(refresh) tr.activity { view-transition-name: match-element; view-transition-class: activity; }
      ::view-transition-group(*.activity) { animation-duration: 300ms; animation-timing-function: cubic-bezier(0.2, 0, 0, 1); }
      ::view-transition-new(*.activity):only-child { animation: row-in 300ms ease-out both; }
      ::view-transition-old(*.activity):only-child { animation: fade-out 200ms ease-in both; }
      @keyframes fade-in { from { opacity: 0; } }
      @keyframes fade-out { to { opacity: 0; } }
      @keyframes rise-in { from { opacity: 0; transform: translateY(8px); } }
      @keyframes row-in { from { opacity: 0; transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
        .placeholder, p.pending { animation: none; }
        .card { transition: none; }
      }
      a.connect { display: inline-block; background: var(--accent); color: var(--surface); padding: 10px 18px; border-radius: 6px; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
